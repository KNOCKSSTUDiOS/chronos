<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neonRim)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Lens Barrel -->
  <circle cx="256" cy="256" r="188" fill="#18181b" stroke="url(#rimGrad)" stroke-width="16"/>
  <circle cx="256" cy="256" r="168" fill="#09090b" stroke="#27272a" stroke-width="4"/>

  <!-- Aperture Blades -->
  <g fill="#18181b" stroke="#3f3f46" stroke-width="2">
    <path d="M 256,108 L 330,170 L 256,230 Z"/>
    <path d="M 374,188 L 390,280 L 305,270 Z"/>
    <path d="M 370,330 L 300,390 L 265,305 Z"/>
    <path d="M 256,404 L 180,340 L 256,280 Z"/>
    <path d="M 138,324 L 122,232 L 207,242 Z"/>
    <path d="M 142,182 L 212,122 L 247,207 Z"/>
  </g>

  <!-- Inner Optics Lens -->
  <circle cx="256" cy="256" r="82" fill="url(#lensGlow)"/>
  <ellipse cx="230" cy="230" rx="36" ry="24" fill="#ffffff" fill-opacity="0.35" transform="rotate(-30 230 230)"/>
  <circle cx="270" cy="275" r="12" fill="#ffffff" fill-opacity="0.2"/>
</svg>
